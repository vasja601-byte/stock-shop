<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock shop - Оплата</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .copy-btn {
            background-color: #2e7d52;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background-color: #389566;
        }
        .copy-btn span {
            display: block;
            font-size: 12px;
            color: #d4edda;
            margin-top: 2px;
            word-break: break-all;
        }
        #toast {
            visibility: hidden;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 10px;
            position: fixed;
            bottom: 30px;
            z-index: 1;
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 1.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div class="container">
    <h2>STOCK SHOP</h2>
    <div class="subtitle">Магазин товаров</div>

    <!-- Блок реквизитов -->
    <div class="card">
        <div class="card-title">💎 Реквізити для оплати:</div>
        <div style="font-size: 13px; margin-bottom: 12px; color: #ccc;">
            Отримувач: <b>Глова Олеся</b><br>
            ⬇️ Скопіюйте для оплати ⬇️
        </div>

        <!-- Кнопка копирования карты -->
        <button class="copy-btn" onclick="copyText('4441111005972991', 'Номер карти скопійовано!')">
            💳 СКОПІЮВАТИ НОМЕР КАРТИ
            <span>4441111005972991</span>
        </button>
    </div>

    <!-- Блок после оплаты -->
    <div class="card">
        <div class="card-title">📦 Після оплати:</div>
        <div style="font-size: 13px; margin-bottom: 12px; color: #ccc;">
            Надішліть менеджеру скріншот квитанції та заповніть шаблон:
        </div>

        <button class="copy-btn" onclick="copyText('ПІБ: \nНаселений пункт: \nВідділення НП: \nТелефон отримувача: ', 'Шаблон скопійовано!')">
            🤝 СКОПІЮВАТИ ШАБЛОН
            <span style="font-size: 11px; line-height: 1.3;">
                ПІБ<br>Населений пункт<br>Відділення НП<br>Телефон отримувача
            </span>
        </button>
    </div>
</div>

<!-- Всплывающая подсказка -->
<div id="toast">Скопійовано!</div>

<script>
    function copyText(text, message) {
        navigator.clipboard.writeText(text).then(() => {
            showToast(message);
        });
    }

    function showToast(msg) {
        var toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.className = "show";
        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2000);
    }
</script>

</body>
</html>
